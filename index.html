<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <title>Jokenpô</title>
</head>

<body>

    <main class="container">

        <h1>Jokenpô ✊✋✌️</h1>

        <p class="subtitle">Escolha sua jogada</p>

        <div class="choices">
            <button class="choice" id="rock">✊</button>
            <button class="choice" id="paper">✋</button>
            <button class="choice" id="scissors">✌️</button>
        </div>

        <div class="result">
            <p>Você: <span id="player-choice">-</span></p>
            <p>Computador: <span id="computer-choice">-</span></p>

            <h2 id="result-message">Faça sua escolha!</h2>
        </div>

        <div class="score">
            <p>Você: <span id="player-score">0</span></p>
            <p>Computador: <span id="computer-score">0</span></p>
        </div>

    </main>

    <script src="./script.js"></script>

</body>

</html>
